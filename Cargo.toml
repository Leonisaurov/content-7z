[package]
name = "content-7z"
version = "0.2.0"
edition = "2021"
rust-version = "1.82"
description = "TUI browser for 7z, zip and tar archives"
license = "MIT"
readme = "README.md"
keywords = ["tui", "7z", "archive", "terminal", "viewer"]
categories = ["command-line-utilities"]

[dependencies]
crossterm = "0.29"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
which = "6"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
